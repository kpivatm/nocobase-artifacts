name: Deploy to Staging

# New flow (Stage 4): export bundle from Dev → diff review → apply via plugin CLI.
# Bundle is never committed to git (CF-2): it lives only in the CI runner and as a
# short-lived private artifact accessible only to users with repo access.
#
# Required repo-level secrets:
#   DEV_NOCOBASE_URL      — Dev instance base URL (e.g. http://192.168.145.231:13000)
#   DEV_NOCOBASE_EMAIL    — Dev instance admin email
#   DEV_NOCOBASE_PASSWORD — Dev instance admin password
#
# Required environment secrets (GitHub Environment: "staging"):
#   STAGING_NOCOBASE_URL      — Staging instance base URL
#   STAGING_NOCOBASE_EMAIL    — Staging instance admin email
#   STAGING_NOCOBASE_PASSWORD — Staging instance admin password
#
# Required GitHub environment: "staging" (configure required reviewers for apply gate)

on:
  workflow_dispatch:
    inputs:
      module:
        description: 'Module to deploy (e.g. kpi)'
        required: true
        default: 'kpi'
      dry_run:
        description: 'Dry run — show diff only, no changes written'
        type: boolean
        default: false

jobs:
  # ─── Job 1: Export bundle from Dev and diff against Staging ────────────────
  export-and-diff:
    name: Export bundle & diff
    runs-on: [self-hosted, kpivatm]
    outputs:
      has_changes: ${{ steps.diff.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Dev instance
        id: auth-dev
        # node reads credentials from env vars — password never appears in process argv
        run: |
          TOKEN=$(node -e "process.stdout.write(JSON.stringify({account:process.env.DEV_EMAIL,password:process.env.DEV_PASSWORD}))" \
            | curl -sf -m 10 --data @- -H 'Content-Type: application/json' \
              "$DEV_URL/api/auth:signIn" \
            | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
          if [ -z "$TOKEN" ]; then
            echo "ERROR: Failed to authenticate to Dev instance at $DEV_URL"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
        env:
          DEV_URL: ${{ secrets.DEV_NOCOBASE_URL }}
          DEV_EMAIL: ${{ secrets.DEV_NOCOBASE_EMAIL }}
          DEV_PASSWORD: ${{ secrets.DEV_NOCOBASE_PASSWORD }}

      - name: Export config bundle from Dev
        run: |
          node packages/plugins/@kpi/plugin-config-migration/bin/config-migration.js \
            export --out /tmp/bundle.json
          echo "Bundle size: $(wc -c < /tmp/bundle.json) bytes"
        env:
          NOCOBASE_URL: ${{ secrets.DEV_NOCOBASE_URL }}
          NOCOBASE_API_TOKEN: ${{ steps.auth-dev.outputs.token }}

      - name: Upload bundle artifact (private — not committed to git, CF-2)
        uses: actions/upload-artifact@v4
        with:
          name: config-bundle-${{ github.run_id }}
          path: /tmp/bundle.json
          retention-days: 1

      - name: Authenticate to Staging instance
        id: auth-staging
        # node reads credentials from env vars — password never appears in process argv
        run: |
          TOKEN=$(node -e "process.stdout.write(JSON.stringify({account:process.env.STAGING_EMAIL,password:process.env.STAGING_PASSWORD}))" \
            | curl -sf -m 10 --data @- -H 'Content-Type: application/json' \
              "$STAGING_URL/api/auth:signIn" \
            | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
          if [ -z "$TOKEN" ]; then
            echo "ERROR: Failed to authenticate to Staging instance at $STAGING_URL"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
        env:
          STAGING_URL: ${{ secrets.STAGING_NOCOBASE_URL }}
          STAGING_EMAIL: ${{ secrets.STAGING_NOCOBASE_EMAIL }}
          STAGING_PASSWORD: ${{ secrets.STAGING_NOCOBASE_PASSWORD }}

      - name: Diff bundle against Staging
        id: diff
        run: |
          set +e
          node packages/plugins/@kpi/plugin-config-migration/bin/config-migration.js \
            diff --source /tmp/bundle.json
          DIFF_EXIT=$?
          # Exit 1 = has changes (not an error); exit 2+ = actual error
          if [ $DIFF_EXIT -eq 1 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          elif [ $DIFF_EXIT -eq 0 ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected — staging is already up to date."
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "Diff command failed (exit $DIFF_EXIT); inspect logs above."
            exit $DIFF_EXIT
          fi
        env:
          NOCOBASE_URL: ${{ secrets.STAGING_NOCOBASE_URL }}
          NOCOBASE_API_TOKEN: ${{ steps.auth-staging.outputs.token }}

  # ─── Job 2: Apply to Staging (requires environment approval) ───────────────
  # Reviewer sees the diff in Job 1 logs before approving this job.
  # CF-3: Workflows that are new at target will have credentials stripped —
  # operator must re-enter them in the NocoBase UI after apply (see runbook).
  apply-staging:
    name: Apply to Staging
    needs: export-and-diff
    # Skip entirely when there are no changes to apply
    if: needs.export-and-diff.outputs.has_changes == 'true'
    runs-on: [self-hosted, kpivatm]
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Download bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: config-bundle-${{ github.run_id }}
          path: /tmp

      - name: Authenticate to Staging instance
        id: auth
        # node reads credentials from env vars — password never appears in process argv
        run: |
          TOKEN=$(node -e "process.stdout.write(JSON.stringify({account:process.env.STAGING_EMAIL,password:process.env.STAGING_PASSWORD}))" \
            | curl -sf -m 10 --data @- -H 'Content-Type: application/json' \
              "$STAGING_URL/api/auth:signIn" \
            | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
          if [ -z "$TOKEN" ]; then
            echo "ERROR: Failed to authenticate to Staging instance at $STAGING_URL"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
        env:
          STAGING_URL: ${{ secrets.STAGING_NOCOBASE_URL }}
          STAGING_EMAIL: ${{ secrets.STAGING_NOCOBASE_EMAIL }}
          STAGING_PASSWORD: ${{ secrets.STAGING_NOCOBASE_PASSWORD }}

      - name: Pre-apply backup
        id: pre-backup
        # Skip for dry-run (nothing will be written, no rollback needed).
        # Hard-fail when backup is unavailable so apply never runs without a safety net.
        # Saves the config bundle JSON to /tmp/pre_backup.json for use in rollback.
        # No pg_dump / Backup Manager dependency — uses plugin-config-migration:backup.
        if: github.event.inputs.dry_run != 'true'
        run: |
          node packages/plugins/@kpi/plugin-config-migration/bin/config-migration.js \
            backup --out /tmp/pre_backup.json
          if [ ! -s /tmp/pre_backup.json ]; then
            echo "ERROR: Pre-apply backup failed — /tmp/pre_backup.json is empty or missing."
            echo "Cannot proceed with apply without a valid backup."
            exit 1
          fi
          echo "Pre-apply backup created: /tmp/pre_backup.json ($(wc -c < /tmp/pre_backup.json) bytes)"
          echo "backup_file=/tmp/pre_backup.json" >> "$GITHUB_OUTPUT"
        env:
          NOCOBASE_URL: ${{ secrets.STAGING_NOCOBASE_URL }}
          NOCOBASE_API_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Apply config to Staging
        id: apply
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
            echo "Dry-run mode — no changes will be written."
          fi
          # --no-backup: backup was taken in pre-backup step (skipped for dry-run, no-op there)
          node packages/plugins/@kpi/plugin-config-migration/bin/config-migration.js \
            apply --source /tmp/bundle.json --no-backup $DRY_RUN_FLAG
        env:
          NOCOBASE_URL: ${{ secrets.STAGING_NOCOBASE_URL }}
          NOCOBASE_API_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Auto-rollback on apply failure
        # Re-applies the pre-apply bundle to restore Staging config state.
        # No pg_dump / Backup Manager — uses plugin-config-migration:rollback.
        if: failure() && steps.pre-backup.outputs.backup_file != ''
        run: |
          BACKUP="${{ steps.pre-backup.outputs.backup_file }}"
          echo "Apply failed — initiating rollback from bundle: $BACKUP"
          node packages/plugins/@kpi/plugin-config-migration/bin/config-migration.js \
            rollback --backup-file "$BACKUP"
        env:
          NOCOBASE_URL: ${{ secrets.STAGING_NOCOBASE_URL }}
          NOCOBASE_API_TOKEN: ${{ steps.auth.outputs.token }}
